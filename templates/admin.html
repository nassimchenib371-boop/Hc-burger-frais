<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HC Burger Frais</title>
</head>
<body>

<h1>🍔 Administration HC Burger Frais</h1>

<h2>Commandes</h2>

<div id="orders">
    Chargement des commandes...
</div>

<script>
async function loadOrders() {
    try {
        const response = await fetch('/api/admin/orders');
        const orders = await response.json();

        const container = document.getElementById('orders');

        if (orders.length === 0) {
            container.innerHTML = "<p>Aucune commande pour le moment.</p>";
            return;
        }

container.innerHTML = orders.map(order => `
    <div>
        <hr>
        <h3>Commande #${order.id}</h3>
<p><strong>Nom :</strong> ${order.customer_name}</p>
<p><strong>Téléphone :</strong> ${order.phone}</p>
<p><strong>Quantité :</strong> ${order.items?.[0]?.quantity ?? ""}</p>

<p><strong>Commande :</strong> ${
    order.items?.map(item => item.name + " × " + item.quantity + " — " + Number(item.price).toFixed(2) + " €").join("<br>") || "Non disponible"
}</p>

        <p><strong>Total :</strong> ${order.total ?? 0} €</p>
        <p><strong>Statut :</strong> ${order.status}</p>

        <button onclick="changeStatus(${order.id}, 'accepted')">✅ Accepter</button>
        <button onclick="changeStatus(${order.id}, 'refused')">❌ Refuser</button>
        <button onclick="changeStatus(${order.id}, 'done')">✅ Terminé</button>
        <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
    </div>
`).join('')

    } catch (error) {
        document.getElementById('orders').innerHTML =
            "<p>Erreur lors du chargement des commandes.</p>";
    }
}
async function changeStatus(id, status) {
  await fetch(`/api/admin/orders/${id}/status`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({status: status})
  });
  loadOrders();
}

async function printOrder(id) {
  const response = await fetch(`/api/admin/orders/${id}/print`, {
    method: "POST"
  });
  const result = await response.json();
  alert(result.message || "Impression envoyée");
}
loadOrders();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HC Burger Frais</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🍔 Administration HC Burger Frais</h1>

<div id="restaurant-control" style="margin:16px 0;padding:16px;border:2px solid #222;border-radius:12px;text-align:center;">
    <div id="restaurant-state" style="font-weight:700;font-size:20px;margin-bottom:10px;">Chargement...</div>
    <button id="restaurant-toggle" onclick="toggleRestaurant()" style="font-size:18px;padding:12px 18px;font-weight:700;">...</button>
</div>

<h2>Commandes</h2>

<button id="alarm-enable" onclick="enableAlarm()" style="width:100%;padding:14px;margin:0 0 14px;background:#ffcc00;border:2px solid #111;border-radius:10px;font-weight:800;font-size:17px;">🔔 ACTIVER L’ALARME DES COMMANDES</button>
<div id="alarm-state" style="display:none;margin:0 0 14px;padding:10px;border-radius:10px;background:#e8f7e8;font-weight:700;text-align:center;">🔔 Alarme activée</div>

<div id="orders">
    Chargement des commandes...
</div>

<script>
    let lastOrderIds = [];
    let restaurantOpen = true;
    let alarmEnabled = false;
    let alarmTimer = null;
    let audioCtx = null;

    function enableAlarm() {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            alarmEnabled = true;
            document.getElementById("alarm-enable").style.display = "none";
            document.getElementById("alarm-state").style.display = "block";
            updateAlarmFromOrders(window.currentOrders || []);
        } catch (e) {
            alert("Impossible d’activer le son. Vérifiez le volume de la tablette.");
        }
    }

    function ringOnce() {
        if (!alarmEnabled || !audioCtx) return;
        try {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const now = audioCtx.currentTime;
            [0, 0.28, 0.56].forEach(delay => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.0001, now + delay);
                gain.gain.exponentialRampToValueAtTime(0.35, now + delay + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.20);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + delay); osc.stop(now + delay + 0.22);
            });
        } catch (e) {}
    }

    function startAlarm() {
        if (!alarmEnabled || alarmTimer) return;
        ringOnce();
        alarmTimer = setInterval(ringOnce, 3000);
    }

    function stopAlarm() {
        if (alarmTimer) clearInterval(alarmTimer);
        alarmTimer = null;
    }

    function updateAlarmFromOrders(orders) {
        const hasPending = Array.isArray(orders) && orders.some(o => o.status === "pending");
        if (hasPending) startAlarm(); else stopAlarm();
    }

    async function loadRestaurantStatus() {
        const r = await fetch('/api/admin/restaurant-status');
        const data = await r.json();
        restaurantOpen = !!data.open;
        const state = document.getElementById('restaurant-state');
        const btn = document.getElementById('restaurant-toggle');
        state.textContent = restaurantOpen ? '🟢 RESTAURANT OUVERT' : '🔴 RESTAURANT FERMÉ';
        btn.textContent = restaurantOpen ? '🔴 FERMER LES COMMANDES' : '🟢 OUVRIR LES COMMANDES';
    }

    async function toggleRestaurant() {
        const r = await fetch('/api/admin/restaurant-status', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({open: !restaurantOpen})
        });
        if (r.ok) loadRestaurantStatus();
    }
    function actionButtons(order) {
    if (order.status === "pending") {
        return `
            <button onclick="changeStatusAndPrint(${order.id})">✅ Accepter</button>
            <button onclick="changeStatus(${order.id}, 'rejected')">❌ Refuser</button>
            <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
        `;
    }

    if (order.status === "accepted") {
        return `
            <button onclick="changeStatus(${order.id}, 'done')">✅ Terminé</button>
            <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
        `;
    }

    return `
        <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
    `;
}
async function loadOrders() {
    try {
        const response = await fetch('/api/admin/orders');
        const orders = await response.json();
        window.currentOrders = orders;
        const newOrders = orders.filter(o => !lastOrderIds.includes(o.id));
        lastOrderIds = orders.map(o => o.id);
        updateAlarmFromOrders(orders);
        const activeOrders = orders.filter(order => order.status !== "done" && order.status !== "rejected");
        const container = document.getElementById('orders');

        if (activeOrders.length === 0) {
            container.innerHTML = "<p>Aucune commande pour le moment.</p>";
            return;
        }

container.innerHTML = activeOrders.map(order => `
    <div>
        <hr>
        <h3>Commande #${order.id}</h3>
<p><strong>Nom :</strong> ${order.customer_name}</p>
<p><strong>Téléphone :</strong> ${order.phone}</p>
<p><strong>Quantité :</strong> ${(order.items || []).reduce((sum, item) => sum + Number(item.quantity || 0), 0)}</p>
<p><strong>Adresse :</strong> ${order.address || "—"}</p>
<p><strong>Type :</strong> ${order.order_type || "—"}</p>
<p><strong>Commande :</strong><br>
${order.items?.map(item => {
    const formule = item.loyalty_gift === true
    ? `🎁 FIDÉLITÉ — MENU OFFERT${item.drink ? " (" + item.drink + ")" : ""}`
    : (item.formula === "offert" || item.promo === true)
        ? "🎁 OFFERT"
        : item.formula === "menu"
            ? `🍟🥤 Menu${item.drink ? " (" + item.drink + ")" : ""}`
            : "🍔 Seul";

    return `${item.name} × ${item.quantity} — ${formule}
    ${item.viande ? `<br>🥩 Viande : ${item.viande}` : ""}
    ${item.sauce ? `<br>🥫 Sauce : ${item.sauce}` : ""}
    ${Array.isArray(item.supplements) && item.supplements.length > 0
    ? `<br>➕ Suppléments : ${item.supplements.join(", ")}`
    : ""}
${Array.isArray(item.garnitures) && item.garnitures.length > 0
    ? `<br>🥗 Garnitures : ${item.garnitures.join(", ")}`
    : ""}`;
    
}).join("<br>") || "Non disponible"}
</p>

        <p><strong>Total :</strong> ${Number(order.total ?? 0).toFixed(2)} €</p>
        <p><strong>Statut :</strong> ${order.status === "pending" ? "🟠 En attente" : order.status === "accepted" ? "🟢 Acceptée" : order.status}</p>
${actionButtons(order)}
    
    </div>
`).join('')

    } catch (error) {
        document.getElementById('orders').innerHTML =
            "<p>Erreur lors du chargement des commandes.</p>";
    }
}
async function changeStatus(id, status) {
  await fetch(`/api/admin/orders/${id}/status`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({status: status})
  });
  loadOrders();
}
async function changeStatusAndPrint(id) {
    try {
        const response = await fetch(`/api/admin/orders/${id}/status`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({status: "accepted"})
        });
        if (!response.ok) {
            alert("Erreur : la commande n’a pas été acceptée.");
            return;
        }
        await loadOrders();
        printOrder(id);
    } catch (e) {
        alert("Erreur réseau : réessayez.");
    }
}
function printOrder(id) {
    const order = window.currentOrders.find(o => o.id === id);
    if (!order) return;
const clean = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    let text = "\x1D\x21\x11HC BURGER FRAIS\x1D\x21\x00\n";
    text += "------------------------------\n";
    text += `\x1D\x21\x11Commande #${order.id}\n`;
    const orderDate = order.created_at ? new Date(order.created_at) : new Date();
const dateText = orderDate.toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" });
const timeText = orderDate.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
text += `\x1D\x21\x00Date: ${dateText} - ${timeText}\n`;
    text += `\x1D\x21\x00Nom: ${clean(order.customer_name)}\n`;
    text += `Telephone: ${clean(order.phone)}\n`;
    text += `Adresse: ${clean(order.address || "-")}\n`;
    text += `Type: ${clean(order.order_type)}\n`;
    (order.items || []).forEach(item => {
    if (item.loyalty_gift === true) {
        text += "*** CADEAU FIDELITE - MENU OFFERT ***\n";
        text += "5 MENUS FIDELITE VALIDES\n";
    } else if (item.formula === "offert" || item.promo === true) {
        text += "*** OFFERT ***\n";
    }

    text += `${clean(item.name)} x ${item.quantity}\n`;

    if (item.formula === "menu" || item.formula === "loyalty") {
        text += `Menu - ${clean(item.drink || "")}\n`;
    } else if (!(item.formula === "offert" || item.promo === true)) {
        text += "Seul\n";
    }

        if (item.viande) text += `Viande: ${clean(item.viande)}\n`;
        if (item.sauce) text += `Sauce: ${clean(item.sauce)}\n`;

        if (item.supplements && item.supplements.length) {
            text += `Supplements: ${item.supplements.map(clean).join(", ")}\n`;
        }

        if (item.garnitures && item.garnitures.length) {
            text += `Garnitures: ${item.garnitures.map(clean).join(", ")}\n`;
        }

        text += "------------------------------\n";
    });

    text += `\x1D\x21\x11TOTAL: ${Number(order.total).toFixed(2)} EUR\x1D\x21\x00\n`;
    text += "\n\n\n\n\n\n\n\n\n\n\n\n";
    const base64 = btoa(unescape(encodeURIComponent(text)));
    window.location.href = "rawbt:base64," + base64;
}
loadRestaurantStatus();
loadOrders();
setInterval(loadOrders, 2000);
document.addEventListener("visibilitychange", loadOrders);
window.addEventListener("focus", loadOrders);
let wakeLock = null;
async function keepScreenAwake() {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
}
keepScreenAwake();
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        keepScreenAwake();
        loadOrders();
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HC Burger Frais</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🍔 Administration HC Burger Frais</h1>

<h2>Commandes</h2>

<div id="orders">
    Chargement des commandes...
</div>

<script>
    setTimeout(() => alert(speechSynthesis.getVoices().map((v,i) => i + " - " + v.name + " - " + v.lang).join("\n")), 1000);
    let lastOrderIds = [];
    function actionButtons(order) {
    if (order.status === "pending") {
        return `
            <button onclick="changeStatusAndPrint(${order.id})">✅ Accepter</button>
            <button onclick="changeStatus(${order.id}, 'rejected')">❌ Refuser</button>
            <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
        `;
    }

    if (order.status === "accepted") {
        return `
            <button onclick="changeStatus(${order.id}, 'done')">✅ Terminé</button>
            <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
        `;
    }

    return `
        <button onclick="printOrder(${order.id})">🖨️ Imprimer</button>
    `;
}
async function loadOrders() {
    try {
        const response = await fetch('/api/admin/orders');
        const orders = await response.json();
        window.currentOrders = orders;
        const newOrders = orders.filter(o => !lastOrderIds.includes(o.id));

if (lastOrderIds.length > 0 && newOrders.length > 0) {
    const voice = new SpeechSynthesisUtterance("HC Burgueur, vous avez une nouvelle commande");
    voice.voice = speechSynthesis.getVoices().filter(v => v.lang === "fr-FR")[2];
    speechSynthesis.cancel();
    speechSynthesis.speak(voice);
}
lastOrderIds = orders.map(o => o.id);
        const activeOrders = orders.filter(order => order.status !== "done" && order.status !== "rejected");
        const container = document.getElementById('orders');

        if (activeOrders.length === 0) {
            container.innerHTML = "<p>Aucune commande pour le moment.</p>";
            return;
        }

container.innerHTML = activeOrders.map(order => `
    <div>
        <hr>
        <h3>Commande #${order.id}</h3>
<p><strong>Nom :</strong> ${order.customer_name}</p>
<p><strong>Téléphone :</strong> ${order.phone}</p>
<p><strong>Quantité :</strong> ${order.items?.[0]?.quantity ?? ""}</p>
<p><strong>Adresse :</strong> ${order.address || "—"}</p>
<p><strong>Type :</strong> ${order.order_type || "—"}</p>
<p><strong>Commande :</strong><br>
${order.items?.map(item => {
    const formule = item.formula === "menu"
        ? `🍟🥤 Menu${item.drink ? " (" + item.drink + ")" : ""}`
        : "🍔 Seul";

    return `${item.name} × ${item.quantity} — ${formule}
    ${item.viande ? `<br>🥩 Viande : ${item.viande}` : ""}
    ${item.sauce ? `<br>🥫 Sauce : ${item.sauce}` : ""}
    ${Array.isArray(item.supplements) && item.supplements.length > 0
    ? `<br>➕ Suppléments : ${item.supplements.join(", ")}`
    : ""}
${Array.isArray(item.garnitures) && item.garnitures.length > 0
    ? `<br>🥗 Garnitures : ${item.garnitures.join(", ")}`
    : ""}`;
    
}).join("<br>") || "Non disponible"}
</p>

        <p><strong>Total :</strong> ${Number(order.total ?? 0).toFixed(2)} €</p>
        <p><strong>Statut :</strong> ${order.status === "pending" ? "🟠 En attente" : order.status === "accepted" ? "🟢 Acceptée" : order.status}</p>
${actionButtons(order)}
    
    </div>
`).join('')

    } catch (error) {
        document.getElementById('orders').innerHTML =
            "<p>Erreur lors du chargement des commandes.</p>";
    }
}
async function changeStatus(id, status) {
  await fetch(`/api/admin/orders/${id}/status`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({status: status})
  });
  loadOrders();
}
function changeStatusAndPrint(id) {
    fetch(`/api/admin/orders/${id}/status`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status: "accepted"})
    });

    printOrder(id);
}
function printOrder(id) {
    const order = window.currentOrders.find(o => o.id === id);
    if (!order) return;
const clean = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    let text = "\x1D\x21\x11HC BURGER FRAIS\x1D\x21\x00\n";
    text += "------------------------------\n";
    text += `\x1D\x21\x11Commande #${order.id}\n`;
    text += `\x1D\x21\x00Nom: ${clean(order.customer_name)}\n`;
    text += `Telephone: ${clean(order.phone)}\n`;
    text += `Adresse: ${clean(order.address || "-")}\n`;
    text += `Type: ${clean(order.order_type)}\n`;
    (order.items || []).forEach(item => {
        text += `${clean(item.name)} x ${item.quantity}\n`;

        if (item.formula === "menu") {
            text += `Menu - ${clean(item.drink || "")}\n`;
        } else {
            text += "Seul\n";
        }

        if (item.viande) text += `Viande: ${clean(item.viande)}\n`;
        if (item.sauce) text += `Sauce: ${clean(item.sauce)}\n`;

        if (item.supplements && item.supplements.length) {
            text += `Supplements: ${item.supplements.map(clean).join(", ")}\n`;
        }

        if (item.garnitures && item.garnitures.length) {
            text += `Garnitures: ${item.garnitures.map(clean).join(", ")}\n`;
        }

        text += "------------------------------\n";
    });

    text += `\x1D\x21\x11TOTAL: ${Number(order.total).toFixed(2)} EUR\x1D\x21\x00\n`;
    text += "\n\n\n\n\n\n\n\n\n\n\n\n";
    const base64 = btoa(unescape(encodeURIComponent(text)));
    window.location.href = "rawbt:base64," + base64;
}
loadOrders();
setInterval(loadOrders, 2000);
document.addEventListener("visibilitychange", loadOrders);
window.addEventListener("focus", loadOrders);
navigator.wakeLock?.request("screen").catch(() => {});
let voice = new SpeechSynthesisUtterance("HC Burgueur, vous avez une nouvelle commande");
voice.lang = "fr-FR";
speechSynthesis.speak(voice);
</script>

</body>
</html>

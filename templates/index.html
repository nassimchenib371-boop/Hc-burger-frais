<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC Burger Frais</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🍔 HC Burger Frais</h1>
<a href="{{ url_for('cart') }}" class="cart-btn">🛒 Mon panier</a>
    <h2>Nos produits</h2>

    <div class="products">
        {% for product in products %}
<div class="product-card">

    {% if product.image %}
    <img src="{{ url_for('static', filename=product.image) }}"
         alt="{{ product.name }}">
    {% endif %}

    <h3>{{ product.name }}</h3>

    {% if product.description %}
    <p>{{ product.description }}</p>
    {% endif %}

    <strong>{{ product.price }} €</strong>

    <a href="{{ url_for('add_to_cart', pid=product.id) }}"
       onclick="addToCart(event, this)">
        Ajouter au panier 🛒
    </a>

</div>
{% endfor %}
       </div>
    <script>
async function addToCart(event, link) {
    event.preventDefault();

    await fetch(link.href);

    const oldText = link.innerHTML;
    link.innerHTML = "✅ Ajouté au panier";

    setTimeout(() => {
        link.innerHTML = oldText;
    }, 1200);
}
</script>   

</body>
</html>
